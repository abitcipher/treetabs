[package]
name = "treetabs-sync"
description = "treetabs server (store owner), client connection and the native messaging host"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "treetabs-host"
path = "src/bin/host.rs"

[dependencies]
treetabs-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
log.workspace = true
# std::time::Instant panics in wasm (the extension runs the hub there).
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[lints]
workspace = true
