[workspace]
resolver = "3"
members = ["crates/treetabs-core", "crates/treetabs-cli", "crates/treetabs-gui", "crates/treetabs-sync", "crates/treetabs-ui", "xtask"]
exclude = ["extension"]

[workspace.package]
edition = "2024"
# `if let` chains (1.88) and `File::try_lock` (1.89) are used.
rust-version = "1.89"
version = "0.4.3"
license = "MIT"

# Shared by every crate (`[lints] workspace = true`).
[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
ignore_without_reason = "warn"
allow_attributes_without_reason = "warn"
# `as` casts that can silently lose data: use `try_from` or say why not.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
# Public functions that return `Result` say when they fail.
missing_errors_doc = "warn"
# Functions stay under 100 lines.
too_many_lines = "warn"

[workspace.dependencies]
treetabs-core = { path = "crates/treetabs-core" }
treetabs-sync = { path = "crates/treetabs-sync" }
treetabs-ui = { path = "crates/treetabs-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
snap = "1.1"
log = "0.4"
clap = { version = "4", features = ["derive"] }
# egui_ltreeview 0.9 targets egui 0.36, so eframe stays on 0.36 too.
eframe = "0.36"
egui = "0.36"
egui_ltreeview = "0.9"
