[package]
name = "treetabs-extension"
description = "Browser extension: relays tabs, windows and bookmarks to the treetabs native host, or owns the tree itself without it"
version = "0.4.6"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxichrome = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
treetabs-core = { path = "../crates/treetabs-core" }
treetabs-sync = { path = "../crates/treetabs-sync" }
serde = "1"
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
